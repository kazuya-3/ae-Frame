name: GitHub Pages に公開

# 既定のブランチに入ったら自動で公開する。手動実行もできる。
#
# このリポジトリには main がまだ無く、既定のブランチは
# claude/tiktok-icon-frame-editor-dbgywf のほう。
# main だけを見ていると、いつまで経っても公開が始まらない
# （実際そうなっていて、お試しリンクでしか動かせない状態が続いた）。
# main を作ったあともそのまま動くように、両方を見る。
on:
  push:
    branches:
      - main
      - claude/tiktok-icon-frame-editor-dbgywf
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は同時に1本だけ。走っている途中のものは止めない。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ── お礼（チップ）の送り先 ──
      #
      # リポジトリ変数 TIP_URL に決済リンクを入れると、次の公開から入口が出る。
      # 空のあいだは、入口も文言も配るものに入らない（vite.config.ts の
      # ae-frame:tip-entry が、モジュールごと差し替える）。
      #
      # secret ではなく variable にしてある。中身は誰でも見る公開URLで、
      # secret にするとログで伏せ字になり、取り違えたときに気づけない。
      #
      # 入れる前に Stripe の事前確認が要る。手順は docs/tip-restart-plan.md。
      #
      # npm run build の中で tsc -b も走るので、ここで別に叩かない。
      # オプションを足して叩くと src/ に .js が吐かれ、以後 Vite が
      # .tsx ではなくそちらを読んでしまう（引き継ぎ資料 CASE 14）。
      - run: npm run build
        env:
          VITE_TIP_URL: ${{ vars.TIP_URL }}

      # 透過の品質は、壊れても型では気づけない。実ブラウザで確かめてから公開する。
      #
      # 検証にも同じ値を渡す。渡さないと「空のはずなのに文言が入っている」と
      # 判定されて、入れた側の公開が通らなくなる。
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          VITE_TIP_URL: ${{ vars.TIP_URL }}

      # Pages のスイッチ（Settings → Pages → Source を「GitHub Actions」に）は、
      # 一度だけ人が手で入れる必要がある。ここは自動化できない。
      #
      # enablement: true でワークフロー自身に有効化させようとして、
      # private のときと public にしたあとの2回とも同じところで落ちた。
      #   Create Pages site failed.
      #   Error: Resource not accessible by integration
      # ワークフローの既定のトークンには Pages サイトを「作る」権限が無い
      # （deploy する権限はある）。公開・非公開とは関係なかった。
      #
      # enablement を付けないほうがエラー文も親切なので、こちらに戻してある
      #   → 「Please verify that the repository has Pages enabled」
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
