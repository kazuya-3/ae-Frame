name: GitHub Pages に公開

# 既定のブランチに入ったら自動で公開する。手動実行もできる。
#
# このリポジトリには main がまだ無く、既定のブランチは
# claude/tiktok-icon-frame-editor-dbgywf のほう。
# main だけを見ていると、いつまで経っても公開が始まらない
# （実際そうなっていて、お試しリンクでしか動かせない状態が続いた）。
# main を作ったあともそのまま動くように、両方を見る。
on:
  push:
    branches:
      - main
      - claude/tiktok-icon-frame-editor-dbgywf
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は同時に1本だけ。走っている途中のものは止めない。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # npm run build の中で tsc -b も走るので、ここで別に叩かない。
      # オプションを足して叩くと src/ に .js が吐かれ、以後 Vite が
      # .tsx ではなくそちらを読んでしまう（引き継ぎ資料 CASE 14）。
      - run: npm run build

      # 透過の品質は、壊れても型では気づけない。実ブラウザで確かめてから公開する。
      - run: npx playwright install --with-deps chromium
      - run: npm test

      # enablement: true にすると、Pages がまだ有効でなければ
      # ワークフロー自身が有効にしてから進む。
      #
      # 一度これで失敗している（Resource not accessible by integration）。
      # ただしそれはリポジトリが private だったときの話で、
      # 無料プランの private はそもそも Pages を持てない。
      # public にしたので、条件が変わったものとしてもう一度試す。
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
